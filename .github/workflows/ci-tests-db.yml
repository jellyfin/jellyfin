name: Database Tests
on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON array with one object per database server to test. Each
          object has name (the name of the job, which must not contain
          the version so that a required check survives an upgrade),
          provider (the name of the provider), version (the major
          version of the server, which the tests must report), image
          (the pinned image), imageVariable (the environment variable
          through which the tests take the image, which must be
          JELLYFIN_TEST_, the provider in capitals and _IMAGE),
          settings (the run settings file in tests/), requiredTests (a
          space separated list of project:test entries, each a test
          method that must pass in the results of that test project
          because it skips when the server tools are unavailable; the
          sentinel of every project is required without being listed)
          and optionally timeoutMinutes (the time the job may take, 30
          by default).
        required: true
        type: string

permissions:
  contents: read

env:
  SDK_VERSION: "10.0.x"

jobs:
  run-tests-db:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes || 30 }}

    env:
      JELLYFIN_TEST_EXPECTED_PROVIDER: ${{ matrix.provider }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Pull the database image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_VARIABLE: ${{ matrix.imageVariable }}
          PROVIDER: ${{ matrix.provider }}
          RYUK_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
        run: |
          if [[ "$IMAGE_VARIABLE" != "JELLYFIN_TEST_${PROVIDER^^}_IMAGE" ]]; then
            echo "::error::imageVariable is '$IMAGE_VARIABLE' but the tests read JELLYFIN_TEST_${PROVIDER^^}_IMAGE for $PROVIDER"
            exit 1
          fi

          echo "$IMAGE_VARIABLE=$IMAGE" >> "$GITHUB_ENV"
          docker pull "$IMAGE"
          docker pull "$RYUK_IMAGE"

      - name: Run database tests
        env:
          PROVIDER: ${{ matrix.provider }}
          SETTINGS: ${{ matrix.settings }}
        run: |
          projects=$(grep -l Jellyfin.Database.Testing tests/*/*.csproj || true)
          if [ -z "$projects" ]; then
            echo "::error::No test project references Jellyfin.Database.Testing"
            exit 1
          fi

          status=0
          for project in $projects; do
            dotnet test "$project" \
              --configuration Release \
              --settings "tests/$SETTINGS" \
              --logger "trx;LogFileName=$PROVIDER-$(basename "$project" .csproj).trx" \
              --results-directory TestResults \
              --verbosity minimal || status=1
          done
          exit $status

      - name: Check that every project ran on ${{ matrix.provider }} ${{ matrix.version }}
        env:
          PROVIDER: ${{ matrix.provider }}
          VERSION: ${{ matrix.version }}
          REQUIRED_TESTS: ${{ matrix.requiredTests }}
        run: |
          # The sentinel of every project that references Jellyfin.Database.Testing, by its full name. It
          # must pass in the results of its own project, so a project whose sentinel was filtered out,
          # skipped or not run fails the job even when another project's sentinel passed.
          # ProviderBackend_IsLive also prints the backend and its version, which are checked as well.
          declare -A sentinels=(
            [Jellyfin.Server.Implementations.Tests]=Jellyfin.Server.Implementations.Tests.DatabaseInfrastructure.ProviderBackendTests.ProviderBackend_IsLive
            [Jellyfin.Server.Tests]=Jellyfin.Server.Tests.ProviderBackendTests.ProviderBackend_IsLive
            [Jellyfin.Server.Integration.Tests]=Jellyfin.Server.Integration.Tests.JellyfinApplicationFactoryTests.CreateClient_SelectedProvider_RunsTheServerOnThatProvider
          )

          # The same projects as the step that ran the tests.
          projects=()
          for project in $(grep -l Jellyfin.Database.Testing tests/*/*.csproj || true); do
            projects+=("$(basename "$project" .csproj)")
          done
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No test project references Jellyfin.Database.Testing"
            exit 1
          fi

          set -f
          declare -A required=()
          for project in "${projects[@]}"; do
            if [ -z "${sentinels[$project]:-}" ]; then
              echo "::error::$project references Jellyfin.Database.Testing but has no sentinel in this check"
              exit 1
            fi
            required[$project]="name:${sentinels[$project]}"
          done
          for project in "${!sentinels[@]}"; do
            if [ -z "${required[$project]:-}" ]; then
              echo "::error::$project has a sentinel in this check but does not reference Jellyfin.Database.Testing"
              exit 1
            fi
          done
          for entry in $REQUIRED_TESTS; do
            if [[ ! $entry =~ ^([A-Za-z0-9_.]+):([A-Za-z0-9_]+)$ ]]; then
              echo "::error::'$entry' in requiredTests is not a project and a test method name, separated by a colon"
              exit 1
            fi
            if [ -z "${required[${BASH_REMATCH[1]}]:-}" ]; then
              echo "::error::'$entry' in requiredTests names a project that does not reference Jellyfin.Database.Testing"
              exit 1
            fi
            required[${BASH_REMATCH[1]}]+=" method:${BASH_REMATCH[2]}"
          done

          status=0
          for project in "${projects[@]}"; do
            file="TestResults/$PROVIDER-$project.trx"
            if [ ! -f "$file" ]; then
              echo "::error::No test results for $project on $PROVIDER"
              status=1
              continue
            fi

            for test in ${required[$project]}; do
              # A full name matches that test only, a method name that method in any class of the project.
              # Either matches every case of a theory, and every case must pass.
              case $test in
                name:*) pattern="testName=\"${test#name:}"; pattern=${pattern//./\\.} ;;
                method:*) pattern="testName=\"[^\"]*\\.${test#method:}" ;;
              esac
              results=$(grep -o -E "<UnitTestResult [^>]*$pattern(\(|\")[^>]*>" "$file" || true)
              if [ -z "$results" ] || grep -q -v 'outcome="Passed"' <<< "$results"; then
                echo "::error::${test#*:} did not pass in $project on $PROVIDER"
                echo "$results"
                status=1
              fi
            done

            if [[ ${sentinels[$project]} == *.ProviderBackend_IsLive ]] \
              && ! grep -q -E "Database backend: $PROVIDER ${VERSION//./\\.}([^0-9]|$)" "$file"; then
              echo "::error::$project did not run on $PROVIDER $VERSION"
              status=1
            fi
          done
          exit $status

      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.name }}-${{ matrix.version }}
          path: TestResults/*.trx
          retention-days: 14
